name: Fdg

on:
  workflow_dispatch:
    inputs:
      room_code:
        description: "Room code (same as Android)"
        required: false
        default: "PRIVATE-RDP-2026"
      width:
        description: "Exact Windows/stream width (itel S23 native 1612)"
        required: false
        default: "1612"
      height:
        description: "Encoded/fullscreen height"
        required: false
        default: "720"
      fps:
        description: "Target FPS (15-120). Also sets the virtual display refresh rate (v2.4.34). 90 default; use 60 if the VDD cannot expose the mode or the runner CPU cannot keep up"
        required: false
        default: "90"
      bitrate_mbps:
        description: "H264 UDP realtime bitrate Mbps (fixed, hard max 10). NET1 default 4.5 (wire load ~7 Mbps with FEC); raise to 5-6 only if the phone DIAG shows ~0 loss while a video plays"
        required: false
        default: "4.5"
      wire_pace_mbps:
        description: "Smooth per-packet UDP wire ceiling Mbps for P frames (NET1 default 12; must stay >= 2 x bitrate; raise toward 16-20 only once DIAG shows loss is gone)"
        required: false
        default: "12.0"
      key_pace_mbps:
        description: "NET1: wire pace Mbps for IDR/keyframe packets only (clamped to <= wire_pace; 0 = same as wire_pace). IDRs were lost ~30% at full pace; 9 keeps them under what the link carries. Lower (7-8) if IDR still fails, 0 = old behaviour"
        required: false
        default: "9.0"
      crf:
        description: "x264 CRF quality (23 default; 0 = legacy ABR). Lower = sharper"
        required: false
        default: "23"
      vbv_ms:
        description: "VBV buffer ms in CRF mode (lowered to 90 to cap how large/spiky any single frame - especially an IDR - can be, which reduces burst exposure; larger values trade this back for sharper IDRs)"
        required: false
        default: "150"
      idr_sec:
        description: "Backup IDR interval seconds (6 = no 2 s hitch; loss recovery is still instant via client refresh requests)"
        required: false
        default: "6"
      idr_min_gap_ms:
        description: "Coalesce client IDR/PLI requests closer than this many ms to the previous IDR (stops IDR storms on bursty loss; deferred, never dropped). 0 = off"
        required: false
        default: "150"
      x264_quality:
        description: "x264 picture quality tier (v2.4.33). 1 = deblock + CABAC + qpel motion + AQ (fixes mosaic/blocks on fast motion, small CPU cost); 2 = also hex motion search + 8x8 partitions (sharper, more CPU: watch PRDP_NATIVE_JIT x264=); 0 = old ultrafast look"
        required: false
        default: "1"
      x264_threads:
        description: "x264 slice threads (v2.4.31). 2 = less jitter on a 2-4 vCPU runner; 0 = x264 auto (old behaviour, more slices); try 1 if encode jitter (PRDP_NATIVE_JIT x264=) is still spiky"
        required: false
        default: "2"
      liveness_sec:
        description: "Seconds of silent UDP HELLO tolerated before the video peer is cleared (v2.4.31, was fixed 3.5). 6 survives a normal WiFi off/on; raise to 8-10 if you roam slowly"
        required: false
        default: "6.0"
      relay_pace_mbps:
        description: "Wire pace ceiling (Mbps) while the client path is a DERP relay, e.g. right after a WiFi off/on (v2.4.32). Clamped to [2 x bitrate, wire_pace]; restored automatically on DIRECT. 0 = off"
        required: false
        default: "8.0"
      resume_idr:
        description: "1 = send one extra IDR idr_min_gap_ms after the first IDR when the client (re)appears, so a single lost recovery IDR does not freeze the stream (v2.4.32). 0 = off"
        required: false
        default: "1"
      idle_60:
        description: "Always-60fps: keep sending tiny repeat frames while the desktop is idle (1 = on, 0 = off)"
        required: false
        default: "1"
      single_display:
        description: "1 = the 1612x720 VDD becomes the ONLY display so windows can't open off-screen (auto-reverts if capture breaks)"
        required: false
        default: "1"
      ui_lite:
        description: "1 = disable Windows animations/transparency, Defender real-time scan and update/search services during the session"
        required: false
        default: "1"
      security_off:
        description: "1 = turn OFF Windows security (Defender all engines + policy, Firewall, SmartScreen, UAC prompt) at the very start of the job (v2.4.52). 0 = leave security as is"
        required: false
        default: "1"

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 355
    permissions:
      contents: read
    env:
      RDP_SIGNAL_URL: wss://universal-usb-signal.reiseakari.workers.dev/ws
    steps:
      - name: Fast start - security off + parallel prefetch (non-fatal)
        continue-on-error: true
        shell: pwsh
        env:
          SECURITY_OFF: ${{ inputs.security_off }}
        run: |
          $ErrorActionPreference='Continue'
          $ProgressPreference='SilentlyContinue'
          $dl=Join-Path $env:RUNNER_TEMP 'prdp-dl'
          New-Item -ItemType Directory -Path $dl -Force | Out-Null

          $items=@(
            @{n='nefcon.zip'; u='https://github.com/nefarius/nefcon/releases/download/v1.14.0/nefcon_v1.14.0.zip'},
            @{n='vdd.zip';    u='https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/25.7.23/VirtualDisplayDriver-x86.Driver.Only.zip'},
            @{n='ffmpeg.zip'; u='https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip'}
          )
          $jobs=@()
          foreach($it in $items){
            $out=Join-Path $dl ($it.n + '.part')
            $sb={ param($u,$o) $ProgressPreference='SilentlyContinue'; try{ Invoke-WebRequest $u -OutFile $o -UseBasicParsing -ErrorAction Stop; $true }catch{ $false } }
            try{
              if(Get-Command Start-ThreadJob -ErrorAction SilentlyContinue){ $jobs += Start-ThreadJob -ScriptBlock $sb -ArgumentList $it.u,$out }
              else{ $jobs += Start-Job -ScriptBlock $sb -ArgumentList $it.u,$out }
            }catch{ Write-Host "prefetch start skipped: $($it.n): $_"; $jobs += $null }
          }

          function Set-Reg([string]$p,[string]$n,$v,[string]$t='DWord'){
            try{ if(-not (Test-Path $p)){ New-Item -Path $p -Force | Out-Null }; New-ItemProperty -Path $p -Name $n -Value $v -PropertyType $t -Force -ErrorAction Stop | Out-Null }catch{ Write-Host "reg skip: $p\$n ($($_.Exception.Message))" }
          }
          if($env:SECURITY_OFF -ne '0'){
            Write-Host '=== security_off=1: turning Windows security off (best effort) ==='
            foreach($mp in @{DisableRealtimeMonitoring=$true},@{DisableBehaviorMonitoring=$true},@{DisableIOAVProtection=$true},@{DisableScriptScanning=$true},@{DisableBlockAtFirstSeen=$true},@{DisableArchiveScanning=$true},@{DisableScanningNetworkFiles=$true},@{DisableEmailScanning=$true},@{DisableRemovableDriveScanning=$true},@{DisableIntrusionPreventionSystem=$true},@{DisablePrivacyMode=$true},@{DisableCatchupFullScan=$true},@{DisableCatchupQuickScan=$true},@{MAPSReporting=0},@{SubmitSamplesConsent=2},@{PUAProtection=0},@{EnableNetworkProtection=0},@{EnableControlledFolderAccess=0}){
              try{ Set-MpPreference @mp -ErrorAction Stop }catch{ Write-Host "Defender option skipped: $($mp.Keys -join ',')" }
            }
            try{ Add-MpPreference -ExclusionPath 'C:\' -ErrorAction Stop; Write-Host 'Defender exclusion: C:\' }catch{ Write-Host "Defender exclusion skipped: $_" }
            $wd='HKLM:\SOFTWARE\Policies\Microsoft\Windows Defender'
            Set-Reg $wd 'DisableAntiSpyware' 1
            Set-Reg $wd 'DisableAntiVirus' 1
            $rt="$wd\Real-Time Protection"
            foreach($n in 'DisableRealtimeMonitoring','DisableBehaviorMonitoring','DisableOnAccessProtection','DisableScanOnRealtimeEnable','DisableIOAVProtection'){ Set-Reg $rt $n 1 }
            Set-Reg "$wd\Spynet" 'SpynetReporting' 0
            Set-Reg "$wd\Spynet" 'SubmitSamplesConsent' 2
            Set-Reg 'HKLM:\SOFTWARE\Microsoft\Windows Defender\Features' 'TamperProtection' 4
            foreach($svc in 'Sense','WdNisSvc','WinDefend','SecurityHealthService','wscsvc'){
              try{ Stop-Service -Name $svc -Force -ErrorAction Stop; Write-Host "service stopped: $svc" }catch{ Write-Host "service skip: $svc" }
              try{ Set-Service -Name $svc -StartupType Disabled -ErrorAction Stop }catch{ Set-Reg "HKLM:\SYSTEM\CurrentControlSet\Services\$svc" 'Start' 4 }
            }
            foreach($drv in 'WdFilter','WdBoot','WdNisDrv'){ Set-Reg "HKLM:\SYSTEM\CurrentControlSet\Services\$drv" 'Start' 4 }
            try{ Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled False -ErrorAction Stop; Write-Host 'Windows Firewall: off (all profiles)' }catch{ Write-Host "Firewall PS skipped: $_"; try{ netsh advfirewall set allprofiles state off | Out-Null }catch{} }
            Set-Reg 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer' 'SmartScreenEnabled' 'Off' 'String'
            Set-Reg 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\System' 'EnableSmartScreen' 0
            Set-Reg 'HKLM:\SOFTWARE\Policies\Microsoft\MicrosoftEdge\PhishingFilter' 'EnabledV9' 0
            Set-Reg 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Policies\Attachments' 'SaveZoneInformation' 1
            $pol='HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
            Set-Reg $pol 'ConsentPromptBehaviorAdmin' 0
            Set-Reg $pol 'PromptOnSecureDesktop' 0
            try{
              $st=Get-MpComputerStatus -ErrorAction Stop
              Write-Host "Defender status: RealTime=$($st.RealTimeProtectionEnabled) Behavior=$($st.BehaviorMonitorEnabled) IOAV=$($st.IoavProtectionEnabled) Tamper=$($st.IsTamperProtected)"
            }catch{ Write-Host "Defender status unavailable: $_" }
          } else {
            Write-Host 'security_off=0: security left unchanged'
          }

          $null = $jobs | Where-Object { $_ } | Wait-Job -Timeout 240
          for($i=0;$i -lt $items.Count;$i++){
            $part=Join-Path $dl ($items[$i].n + '.part')
            $final=Join-Path $dl $items[$i].n
            $ok=$false
            if($jobs[$i]){ try{ $ok=[bool](Receive-Job $jobs[$i] -ErrorAction SilentlyContinue | Select-Object -Last 1) }catch{} }
            if($ok -and (Test-Path $part) -and ((Get-Item $part).Length -gt 1024)){ Move-Item $part $final -Force; Write-Host ("prefetched {0} ({1:N1} MB)" -f $items[$i].n,((Get-Item $final).Length/1MB)) }
            else{ Remove-Item $part -Force -ErrorAction SilentlyContinue; Write-Host "prefetch missing: $($items[$i].n) (the later step will download it itself)" }
          }
          $jobs | Where-Object { $_ } | Remove-Job -Force -ErrorAction SilentlyContinue
          exit 0

      - name: Join Runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
          log-mode: quiet

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install v2 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          python -m pip install --disable-pip-version-check --no-input --prefer-binary "websockets>=14,<16" "numpy>=2,<3" "soundcard==0.4.5"
          try { Set-Service AudioEndpointBuilder -StartupType Automatic; Start-Service AudioEndpointBuilder } catch { Write-Host "AudioEndpointBuilder start non-fatal: $_" }
          try { Set-Service Audiosrv -StartupType Automatic; Start-Service Audiosrv } catch { Write-Host "Windows Audio start non-fatal: $_" }

      - name: Resolve Tailscale address and firewall
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $ip=(tailscale ip -4 | Select-Object -First 1).Trim()
          if(-not $ip.StartsWith('100.')){ throw "No Tailscale IPv4: $ip" }
          "RDP_TAILSCALE_IP=$ip" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          Write-Host "Runner Tailscale IP: $ip"
          'PrivateRDP v2 UDP','PrivateRDP v2 CONTROL','PrivateRDP v2 VIDEO SYNC','PrivateRDP v2 AUDIO','PrivateRDP v2 FILE' | ForEach-Object { Remove-NetFirewallRule -DisplayName $_ -ErrorAction SilentlyContinue }
          New-NetFirewallRule -DisplayName 'PrivateRDP v2 UDP' -Direction Inbound -Action Allow -Protocol UDP -LocalPort 49100 -RemoteAddress '100.64.0.0/10' | Out-Null
          New-NetFirewallRule -DisplayName 'PrivateRDP v2 CONTROL' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 49101 -RemoteAddress '100.64.0.0/10' | Out-Null
          New-NetFirewallRule -DisplayName 'PrivateRDP v2 AUDIO' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 49103 -RemoteAddress '100.64.0.0/10' | Out-Null
          New-NetFirewallRule -DisplayName 'PrivateRDP v2 FILE' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 49104 -RemoteAddress '100.64.0.0/10' | Out-Null
          tailscale status
          try { tailscale netcheck } catch { Write-Host 'tailscale netcheck unavailable (non-fatal)' }

      - name: Activate exact 1612x720 VDD display - hard required
        shell: pwsh
        env:
          TARGET_W: ${{ inputs.width }}
          TARGET_H: ${{ inputs.height }}
          TARGET_HZ: ${{ inputs.fps }}
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $w=[int]$env:TARGET_W
          $h=[int]$env:TARGET_H
          $hz=[int]$env:TARGET_HZ
          if(($w -band 1) -ne 0 -or ($h -band 1) -ne 0){ throw 'H264 4:2:0 target dimensions must be even' }

          Write-Host "=== PrivateRDP v2.3.5.1 exact display bootstrap ==="
          Write-Host "Requested: ${w}x${h}@${hz}"
          Write-Host "Policy: exact VDD required; no 1600x900 fallback, no letterbox, no crop, no stretch"

          Add-Type -TypeDefinition 'using System.Runtime.InteropServices; public static class PrdpDpi { [DllImport("user32.dll")] public static extern bool SetProcessDPIAware(); }'
          [void][PrdpDpi]::SetProcessDPIAware()
          Add-Type -AssemblyName System.Windows.Forms

          function Test-ExactActive {
            foreach($s in [System.Windows.Forms.Screen]::AllScreens){
              Write-Host "SCREEN before/now: device=$($s.DeviceName) primary=$($s.Primary) bounds=$($s.Bounds)"
              if($s.Bounds.Width -eq $w -and $s.Bounds.Height -eq $h){ return $true }
            }
            return $false
          }

          if(Test-ExactActive){
            Write-Host "EXACT DISPLAY already active."
            "RDP_EXACT_DISPLAY=1" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
            exit 0
          }

          $vddRoot='C:\VirtualDisplayDriver'
          New-Item -ItemType Directory -Path $vddRoot -Force | Out-Null
          New-Item -ItemType Directory -Path "$vddRoot\Logs" -Force | Out-Null

          $xml=@"
          <?xml version='1.0' encoding='utf-8'?>
          <vdd_settings>
            <monitors><count>1</count></monitors>
            <gpu><friendlyname>default</friendlyname></gpu>
            <global><g_refresh_rate>$hz</g_refresh_rate></global>
            <resolutions>
              <resolution>
                <width>$w</width>
                <height>$h</height>
                <refresh_rate>$hz</refresh_rate>
              </resolution>
            </resolutions>
            <logging>
              <SendLogsThroughPipe>true</SendLogsThroughPipe>
              <logging>true</logging>
              <debuglogging>true</debuglogging>
            </logging>
            <colour>
              <SDR10bit>false</SDR10bit>
              <HDRPlus>false</HDRPlus>
              <ColourFormat>RGB</ColourFormat>
            </colour>
            <cursor>
              <HardwareCursor>true</HardwareCursor>
              <CursorMaxX>128</CursorMaxX>
              <CursorMaxY>128</CursorMaxY>
              <AlphaCursorSupport>true</AlphaCursorSupport>
              <XorCursorSupportLevel>2</XorCursorSupportLevel>
            </cursor>
            <edid>
              <CustomEdid>false</CustomEdid>
              <PreventSpoof>false</PreventSpoof>
              <EdidCeaOverride>false</EdidCeaOverride>
            </edid>
            <auto_resolutions>
              <enabled>false</enabled>
              <source_priority>manual</source_priority>
              <edid_mode_filtering>
                <min_refresh_rate>24</min_refresh_rate>
                <max_refresh_rate>240</max_refresh_rate>
                <exclude_fractional_rates>false</exclude_fractional_rates>
                <min_resolution_width>640</min_resolution_width>
                <min_resolution_height>480</min_resolution_height>
                <max_resolution_width>7680</max_resolution_width>
                <max_resolution_height>4320</max_resolution_height>
              </edid_mode_filtering>
              <preferred_mode>
                <use_edid_preferred>false</use_edid_preferred>
                <fallback_width>$w</fallback_width>
                <fallback_height>$h</fallback_height>
                <fallback_refresh>$hz</fallback_refresh>
              </preferred_mode>
            </auto_resolutions>
            <color_advanced>
              <bit_depth_management>
                <auto_select_from_color_space>false</auto_select_from_color_space>
                <force_bit_depth>8</force_bit_depth>
                <fp16_surface_support>true</fp16_surface_support>
              </bit_depth_management>
              <color_format_extended><sdr_white_level>80.0</sdr_white_level></color_format_extended>
            </color_advanced>
          </vdd_settings>
          "@
          $enc=[System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllText((Join-Path $vddRoot 'vdd_settings.xml'),$xml,$enc)

          New-Item -Path 'HKLM:\SOFTWARE\MikeTheTech\VirtualDisplayDriver' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\MikeTheTech\VirtualDisplayDriver' -Name VDDPATH -Value $vddRoot -PropertyType String -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\MikeTheTech\VirtualDisplayDriver' -Name LOGS -Value 1 -PropertyType DWord -Force | Out-Null

          $tmp=Join-Path $env:RUNNER_TEMP 'prdp-v235-vdd'
          Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null
          $nefZip=Join-Path $tmp 'nefcon.zip'
          $drvZip=Join-Path $tmp 'driver.zip'
          $pre=Join-Path $env:RUNNER_TEMP 'prdp-dl'
          if(Test-Path (Join-Path $pre 'nefcon.zip')){ Copy-Item (Join-Path $pre 'nefcon.zip') $nefZip -Force }
          else{ Invoke-WebRequest 'https://github.com/nefarius/nefcon/releases/download/v1.14.0/nefcon_v1.14.0.zip' -OutFile $nefZip -UseBasicParsing }
          if(Test-Path (Join-Path $pre 'vdd.zip')){ Copy-Item (Join-Path $pre 'vdd.zip') $drvZip -Force }
          else{ Invoke-WebRequest 'https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/25.7.23/VirtualDisplayDriver-x86.Driver.Only.zip' -OutFile $drvZip -UseBasicParsing }
          Expand-Archive $nefZip (Join-Path $tmp 'nef') -Force
          Expand-Archive $drvZip (Join-Path $tmp 'drv') -Force

          $nefexe=Get-ChildItem (Join-Path $tmp 'nef') -Recurse -Filter nefconw.exe | Where-Object FullName -Match '\\x64\\' | Select-Object -First 1
          $inf=Get-ChildItem (Join-Path $tmp 'drv') -Recurse -Filter MttVDD.inf | Select-Object -First 1
          $cat=Get-ChildItem (Join-Path $tmp 'drv') -Recurse -Filter mttvdd.cat | Select-Object -First 1
          $dll=Get-ChildItem (Join-Path $tmp 'drv') -Recurse -Filter MttVDD.dll | Select-Object -First 1
          if(-not $nefexe -or -not $inf -or -not $cat -or -not $dll){ throw 'VDD/NefCon payload layout not recognized' }

          Write-Host "VDD DLL signature:"
          Get-AuthenticodeSignature $dll.FullName | Format-List Status,StatusMessage

          $certs=New-Object Security.Cryptography.X509Certificates.X509Certificate2Collection
          $certs.Import([IO.File]::ReadAllBytes($cat.FullName))
          foreach($c in $certs){
            $cp=Join-Path $tmp ($c.Thumbprint+'.cer')
            [IO.File]::WriteAllBytes($cp,$c.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))
            Import-Certificate -FilePath $cp -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' | Out-Null
          }

          $nefLog=Join-Path $tmp 'nefcon-install.log'
          & $nefexe.FullName install $inf.FullName 'Root\MttVDD' 2>&1 | Tee-Object -FilePath $nefLog
          $installExit=$LASTEXITCODE
          if($null -eq $installExit){
            Write-Warning 'NefCon produced no immediate exit code; continuing to authoritative PnP verification.'
          } else {
            Write-Host "NefCon install exit=$installExit"
            if([int]$installExit -ne 0){
              Write-Warning "NefCon returned exit=$installExit; PnP verification will decide whether the VDD is actually usable."
            }
          }
          pnputil /scan-devices 2>&1 | ForEach-Object { Write-Host $_ }
          Start-Sleep -Seconds 3   # v2.4.52: was 15; the PnP health loop below waits up to 24 s anyway

          $healthy=$false
          for($i=0;$i -lt 12;$i++){
            $nodes=Get-PnpDevice -ErrorAction SilentlyContinue | Where-Object {
              $_.InstanceId -match 'MttVDD|MTT1337|ROOT\\MTT' -or $_.FriendlyName -match 'Virtual Display|Mtt|MikeTheTech'
            }
            foreach($d in $nodes){
              $pc=0
              try{$pc=[int](Get-PnpDeviceProperty -InstanceId $d.InstanceId -KeyName 'DEVPKEY_Device_ProblemCode' -ErrorAction Stop).Data}catch{$pc=999}
              Write-Host "VDD PnP: status=$($d.Status) name=$($d.FriendlyName) id=$($d.InstanceId) problem=$pc"
              if($pc -eq 0){$healthy=$true}
            }
            if($healthy){break}
            Start-Sleep -Seconds 2
          }
          if(-not $healthy){ throw 'VDD PnP node did not become healthy (ProblemCode 0)' }

          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          public static class PRDPExactDisplay235 {
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Ansi)]
            public struct DISPLAY_DEVICE { public int cb; [MarshalAs(UnmanagedType.ByValTStr,SizeConst=32)] public string DeviceName; [MarshalAs(UnmanagedType.ByValTStr,SizeConst=128)] public string DeviceString; public int StateFlags; [MarshalAs(UnmanagedType.ByValTStr,SizeConst=128)] public string DeviceID; [MarshalAs(UnmanagedType.ByValTStr,SizeConst=128)] public string DeviceKey; }
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Ansi)]
            public struct DEVMODE { [MarshalAs(UnmanagedType.ByValTStr,SizeConst=32)] public string dmDeviceName; public short dmSpecVersion,dmDriverVersion,dmSize,dmDriverExtra; public int dmFields,dmPositionX,dmPositionY,dmDisplayOrientation,dmDisplayFixedOutput; public short dmColor,dmDuplex,dmYResolution,dmTTOption,dmCollate; [MarshalAs(UnmanagedType.ByValTStr,SizeConst=32)] public string dmFormName; public short dmLogPixels; public int dmBitsPerPel,dmPelsWidth,dmPelsHeight,dmDisplayFlags,dmDisplayFrequency; public int dmICMMethod,dmICMIntent,dmMediaType,dmDitherType,dmReserved1,dmReserved2,dmPanningWidth,dmPanningHeight; }
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern bool EnumDisplayDevices(string a,uint i,ref DISPLAY_DEVICE d,uint f);
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern bool EnumDisplaySettingsEx(string n,int i,ref DEVMODE m,uint f);
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern int ChangeDisplaySettingsEx(string n,ref DEVMODE m,IntPtr h,uint f,IntPtr p);
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern int ChangeDisplaySettingsEx(string n,IntPtr m,IntPtr h,uint f,IntPtr p);
            const int CUR=-1, ATT=1, PRI=4; const int DM_POSITION=0x20,DM_FREQ=0x400000,DM_W=0x80000,DM_H=0x100000; const uint CDS_UP=1,CDS_TEST=2,CDS_PRIMARY=0x10;
            static DISPLAY_DEVICE DD(){var d=new DISPLAY_DEVICE();d.cb=Marshal.SizeOf(typeof(DISPLAY_DEVICE));return d;}
            static DEVMODE DM(){var m=new DEVMODE();m.dmSize=(short)Marshal.SizeOf(typeof(DEVMODE));return m;}
            public static string Dump(int w,int h,int hz){
              var sb=new StringBuilder();
              for(uint i=0;i<32;i++){
                var d=DD(); if(!EnumDisplayDevices(null,i,ref d,0))break;
                sb.AppendLine($"DEV {i} {d.DeviceName} desc={d.DeviceString} flags=0x{d.StateFlags:X} id={d.DeviceID}");
                var c=DM(); if(EnumDisplaySettingsEx(d.DeviceName,CUR,ref c,0))sb.AppendLine($" CURRENT {c.dmPelsWidth}x{c.dmPelsHeight}@{c.dmDisplayFrequency} pos={c.dmPositionX},{c.dmPositionY}");
                bool ex=false;
                for(int x=0;x<4096;x++){
                  var m=DM(); if(!EnumDisplaySettingsEx(d.DeviceName,x,ref m,0))break;
                  if(m.dmPelsWidth==w&&m.dmPelsHeight==h&&(hz<=0||m.dmDisplayFrequency==hz))ex=true;
                }
                sb.AppendLine(" EXACT_EXPOSED="+ex);
              }
              return sb.ToString();
            }
            public static string Apply(int w,int h,int hz){
              var sb=new StringBuilder(); bool any=false;
              for(uint i=0;i<32;i++){
                var d=DD(); if(!EnumDisplayDevices(null,i,ref d,0))break;
                DEVMODE best=DM(); bool have=false;
                for(int x=0;x<4096;x++){
                  var m=DM(); if(!EnumDisplaySettingsEx(d.DeviceName,x,ref m,0))break;
                  if(m.dmPelsWidth==w&&m.dmPelsHeight==h&&(hz<=0||m.dmDisplayFrequency==hz)){best=m;have=true;break;}
                }
                if(!have)continue;
                any=true;
                var t=best;
                int tr=ChangeDisplaySettingsEx(d.DeviceName,ref t,IntPtr.Zero,CDS_TEST,IntPtr.Zero);
                sb.AppendLine($"TEST {d.DeviceName} {d.DeviceString} result={tr}");
                if(tr==0){
                  best.dmFields|=DM_W|DM_H|DM_POSITION;
                  if(best.dmDisplayFrequency>0)best.dmFields|=DM_FREQ;
                  best.dmPositionX=0; best.dmPositionY=0;
                  int ar=ChangeDisplaySettingsEx(d.DeviceName,ref best,IntPtr.Zero,CDS_UP|CDS_PRIMARY,IntPtr.Zero);
                  int cr=ChangeDisplaySettingsEx(null,IntPtr.Zero,IntPtr.Zero,0,IntPtr.Zero);
                  sb.AppendLine($"APPLY result={ar} commit={cr}");
                }
              }
              if(!any)sb.AppendLine("NO_DEVICE_EXPOSES_EXACT_MODE");
              return sb.ToString();
            }
          }
          '@

          & "$env:SystemRoot\System32\DisplaySwitch.exe" /extend | Out-Null
          Start-Sleep -Seconds 4

          $passed=$false
          for($attempt=1;$attempt -le 8;$attempt++){
            Write-Host "=== exact display attempt $attempt ==="
            $dump=[PRDPExactDisplay235]::Dump($w,$h,$hz)
            Write-Host $dump
            if($dump -match 'EXACT_EXPOSED=True'){
              $apply=[PRDPExactDisplay235]::Apply($w,$h,$hz)
              Write-Host $apply
              Start-Sleep -Seconds 3
            } else {
              & "$env:SystemRoot\System32\DisplaySwitch.exe" /extend | Out-Null
              Start-Sleep -Seconds 2
            }
            if(Test-ExactActive){$passed=$true;break}
          }

          if(-not $passed){
            Write-Host '=== final PnP ==='
            Get-PnpDevice -Class Display -ErrorAction SilentlyContinue | Format-Table -AutoSize
            Write-Host '=== final display dump ==='
            Write-Host ([PRDPExactDisplay235]::Dump($w,$h,$hz))
            throw "DISPLAY_EXACT_FAILED expected=${w}x${h}@${hz}; streaming intentionally not started"
          }

          Write-Host "PASS_EXACT_ACTIVE ${w}x${h}@${hz}"
          try{
            Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue
            Start-Sleep -Milliseconds 600
            Start-Process explorer.exe
          }catch{ Write-Host "Explorer refresh non-fatal: $_" }
          "RDP_EXACT_DISPLAY=1" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append


      - name: Build and probe native DXGI capture - hard required
        shell: pwsh
        env:
          TARGET_W: ${{ inputs.width }}
          TARGET_H: ${{ inputs.height }}
          TARGET_FPS: ${{ inputs.fps }}
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $src=Join-Path $env:RUNNER_TEMP 'prdp_dxgi_capture.cpp'
          $exe=Join-Path $env:RUNNER_TEMP 'prdp_dxgi_capture.exe'
          $b64=''
          [IO.File]::WriteAllBytes($src,[Convert]::FromBase64String($b64))

          $vswhere=Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if(-not (Test-Path $vswhere)){ throw 'vswhere.exe not found on windows-latest' }
          $vs=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if(-not $vs){ throw 'MSVC x64 toolchain not found' }
          $vcvars=Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if(-not (Test-Path $vcvars)){ throw "vcvars64.bat missing: $vcvars" }
          $cmd=Join-Path $env:RUNNER_TEMP 'build-prdp-dxgi.cmd'
          $lines=@(
            '@echo off',
            ('call "' + $vcvars + '"'),
            ('cl.exe /nologo /std:c++17 /O2 /EHsc /MD /utf-8 /W4 /DNOMINMAX "' + $src + '" /Fe:"' + $exe + '" /link d3d11.lib dxgi.lib'),
            'exit /b %errorlevel%'
          )
          [IO.File]::WriteAllLines($cmd,$lines,[Text.Encoding]::ASCII)
          & cmd.exe /d /c $cmd
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $exe)){ throw "native DXGI compile failed exit=$LASTEXITCODE" }

          Write-Host '=== Native DXGI exact-output probe ==='
          & $exe --probe --width $env:TARGET_W --height $env:TARGET_H --fps $env:TARGET_FPS
          if($LASTEXITCODE -ne 0){
            throw "NATIVE_DXGI_REQUIRED probe failed exit=$LASTEXITCODE. No MSS/DXCAM fallback is permitted in NO3."
          }
          "RDP_DXGI_CAPTURE_EXE=$exe" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          Write-Host "Native DXGI helper ready: $exe"

      - name: Build native FFmpeg libx264 video hot-path - hard required
        shell: pwsh
        env:
          TARGET_W: ${{ inputs.width }}
          TARGET_H: ${{ inputs.height }}
          TARGET_FPS: ${{ inputs.fps }}
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $ffZip=Join-Path $env:RUNNER_TEMP 'prdp-ffmpeg81-gpl-shared.zip'
          $ffDir=Join-Path $env:RUNNER_TEMP 'prdp-ffmpeg81'
          Remove-Item $ffDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $ffDir -Force | Out-Null
          $preF=Join-Path $env:RUNNER_TEMP 'prdp-dl\ffmpeg.zip'
          if(Test-Path $preF){ $ffZip=$preF }
          else{ Invoke-WebRequest 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-shared-8.1.zip' -OutFile $ffZip -UseBasicParsing }
          & (Join-Path $env:SystemRoot 'System32\tar.exe') -xf $ffZip -C $ffDir
          if($LASTEXITCODE -ne 0){
            Remove-Item $ffDir -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $ffDir -Force | Out-Null
            Expand-Archive $ffZip $ffDir -Force
          }
          $ffRoot=Get-ChildItem $ffDir -Directory -Recurse | Where-Object {
            (Test-Path (Join-Path $_.FullName 'include\libavcodec\avcodec.h')) -and
            (Test-Path (Join-Path $_.FullName 'lib\avcodec.lib')) -and
            (Test-Path (Join-Path $_.FullName 'bin\ffmpeg.exe'))
          } | Select-Object -First 1
          if(-not $ffRoot){ throw 'BtbN FFmpeg shared archive layout not recognized (include/lib/bin required)' }
          Write-Host "FFmpeg root: $($ffRoot.FullName)"
          $encoders=& (Join-Path $ffRoot.FullName 'bin\ffmpeg.exe') -hide_banner -encoders 2>&1 | Out-String
          if($encoders -notmatch 'libx264'){ throw 'BtbN GPL shared build does not expose libx264 encoder' }

          $src=Join-Path $env:RUNNER_TEMP 'prdp_native_video.cpp'
          $exe=Join-Path $env:RUNNER_TEMP 'prdp_native_video.exe'
          $b64=''
          [IO.File]::WriteAllBytes($src,[Convert]::FromBase64String($b64))
          $vswhere='C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          if(-not (Test-Path $vswhere)){ throw 'vswhere.exe missing' }
          $vs=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if(-not $vs){ throw 'MSVC installation not found' }
          $vcvars=Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if(-not (Test-Path $vcvars)){ throw 'vcvars64.bat missing' }
          $cmd=Join-Path $env:RUNNER_TEMP 'build-prdp-native-video.cmd'
          $lines=@(
            '@echo off',
            ('call "' + $vcvars + '" >nul'),
            ('cl.exe /nologo /std:c++17 /O2 /EHsc /MD /DNOMINMAX /DWIN32_LEAN_AND_MEAN /utf-8 /I"' + $ffRoot.FullName + '\include" "' + $src + '" /Fe:"' + $exe + '" /link /LIBPATH:"' + $ffRoot.FullName + '\lib" avcodec.lib avutil.lib swscale.lib ws2_32.lib')
          )
          [IO.File]::WriteAllLines($cmd,$lines,[Text.Encoding]::ASCII)
          & cmd.exe /d /c $cmd
          if($LASTEXITCODE -ne 0 -or -not (Test-Path $exe)){ throw "native FFmpeg video compile failed exit=$LASTEXITCODE" }
          (Join-Path $ffRoot.FullName 'bin') | Out-File $env:GITHUB_PATH -Encoding utf8NoBOM -Append
          "RDP_NATIVE_VIDEO_EXE=$exe" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          "RDP_NATIVE_VIDEO_CTL_PORT=49210" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          Write-Host "PASS_NATIVE_VIDEO_BUILD exe=$exe codec=libx264 FFmpeg=8.1-shared"

      - name: Single-display mode - VDD only (windows cannot open off-screen), auto-revert on failure
        if: ${{ inputs.single_display != '0' }}
        continue-on-error: true
        shell: pwsh
        env:
          TARGET_W: ${{ inputs.width }}
          TARGET_H: ${{ inputs.height }}
          TARGET_FPS: ${{ inputs.fps }}
        run: |
          $ErrorActionPreference='Continue'
          $ProgressPreference='SilentlyContinue'
          $w=[int]$env:TARGET_W
          $h=[int]$env:TARGET_H
          $exe=Join-Path $env:RUNNER_TEMP 'prdp_dxgi_capture.exe'
          Add-Type -TypeDefinition 'using System.Runtime.InteropServices; public static class PrdpDpi { [DllImport("user32.dll")] public static extern bool SetProcessDPIAware(); }'
          [void][PrdpDpi]::SetProcessDPIAware()
          Add-Type -AssemblyName System.Windows.Forms
          try{
          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class PRDPSingleDisplay {
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Ansi)]
            public struct DISPLAY_DEVICE { public int cb; [MarshalAs(UnmanagedType.ByValTStr,SizeConst=32)] public string DeviceName; [MarshalAs(UnmanagedType.ByValTStr,SizeConst=128)] public string DeviceString; public int StateFlags; [MarshalAs(UnmanagedType.ByValTStr,SizeConst=128)] public string DeviceID; [MarshalAs(UnmanagedType.ByValTStr,SizeConst=128)] public string DeviceKey; }
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Ansi)]
            public struct DEVMODE { [MarshalAs(UnmanagedType.ByValTStr,SizeConst=32)] public string dmDeviceName; public short dmSpecVersion,dmDriverVersion,dmSize,dmDriverExtra; public int dmFields,dmPositionX,dmPositionY,dmDisplayOrientation,dmDisplayFixedOutput; public short dmColor,dmDuplex,dmYResolution,dmTTOption,dmCollate; [MarshalAs(UnmanagedType.ByValTStr,SizeConst=32)] public string dmFormName; public short dmLogPixels; public int dmBitsPerPel,dmPelsWidth,dmPelsHeight,dmDisplayFlags,dmDisplayFrequency; public int dmICMMethod,dmICMIntent,dmMediaType,dmDitherType,dmReserved1,dmReserved2,dmPanningWidth,dmPanningHeight; }
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern bool EnumDisplayDevices(string a,uint i,ref DISPLAY_DEVICE d,uint f);
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern bool EnumDisplaySettingsEx(string n,int i,ref DEVMODE m,uint f);
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern int ChangeDisplaySettingsEx(string n,ref DEVMODE m,IntPtr h,uint f,IntPtr p);
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern int ChangeDisplaySettingsEx(string n,IntPtr m,IntPtr h,uint f,IntPtr p);
            const int CUR=-1; const int DM_POSITION=0x20,DM_W=0x80000,DM_H=0x100000; const uint CDS_UP=1,CDS_PRIMARY=0x10,CDS_NORESET=0x10000000;
            static DISPLAY_DEVICE DD(){var d=new DISPLAY_DEVICE();d.cb=Marshal.SizeOf(typeof(DISPLAY_DEVICE));return d;}
            static DEVMODE DM(){var m=new DEVMODE();m.dmSize=(short)Marshal.SizeOf(typeof(DEVMODE));return m;}
            static string FindVdd(int w,int h){
              for(uint i=0;i<32;i++){
                var d=DD(); if(!EnumDisplayDevices(null,i,ref d,0))break;
                if((d.StateFlags&1)==0)continue;
                var c=DM(); if(!EnumDisplaySettingsEx(d.DeviceName,CUR,ref c,0))continue;
                if(c.dmPelsWidth==w&&c.dmPelsHeight==h)return d.DeviceName;
              }
              return null;
            }
            public static string MakePrimary(int w,int h,bool detachOthers){
              var sb=new StringBuilder();
              string vdd=FindVdd(w,h);
              if(vdd==null){sb.AppendLine("NO_ACTIVE_VDD");return sb.ToString();}
              var vm=DM();
              if(!EnumDisplaySettingsEx(vdd,CUR,ref vm,0)){sb.AppendLine("VDD_MODE_READ_FAILED");return sb.ToString();}
              vm.dmFields|=DM_POSITION; vm.dmPositionX=0; vm.dmPositionY=0;
              int r1=ChangeDisplaySettingsEx(vdd,ref vm,IntPtr.Zero,CDS_UP|CDS_PRIMARY|CDS_NORESET,IntPtr.Zero);
              sb.AppendLine("PRIMARY "+vdd+" result="+r1);
              if(detachOthers){
                for(uint i=0;i<32;i++){
                  var d=DD(); if(!EnumDisplayDevices(null,i,ref d,0))break;
                  if((d.StateFlags&1)==0||d.DeviceName==vdd)continue;
                  var dm=DM(); dm.dmFields=DM_POSITION|DM_W|DM_H; dm.dmPelsWidth=0; dm.dmPelsHeight=0; dm.dmPositionX=w; dm.dmPositionY=0;
                  int r2=ChangeDisplaySettingsEx(d.DeviceName,ref dm,IntPtr.Zero,CDS_UP|CDS_NORESET,IntPtr.Zero);
                  sb.AppendLine("DETACH "+d.DeviceName+" "+d.DeviceString+" result="+r2);
                }
              }
              int cr=ChangeDisplaySettingsEx(null,IntPtr.Zero,IntPtr.Zero,0,IntPtr.Zero);
              sb.AppendLine("COMMIT result="+cr);
              return sb.ToString();
            }
          }
          '@
          function Show-Screens($tag){
            Write-Host "--- screens ($tag) ---"
            foreach($s in [System.Windows.Forms.Screen]::AllScreens){ Write-Host "  $($s.DeviceName) primary=$($s.Primary) bounds=$($s.Bounds)" }
          }
          function Test-Single {
            $s=@([System.Windows.Forms.Screen]::AllScreens)
            return ($s.Count -eq 1 -and $s[0].Bounds.Width -eq $w -and $s[0].Bounds.Height -eq $h -and $s[0].Bounds.X -eq 0 -and $s[0].Bounds.Y -eq 0)
          }
          function Test-Probe {
            try{
              $o=(& $exe --probe --width $w --height $h --fps $env:TARGET_FPS 2>&1 | Out-String)
              Write-Host $o
              return ($o -match 'PRDP_DXGI_PROBE_PASS')
            }catch{ Write-Host "probe error: $_"; return $false }
          }
          Show-Screens 'before'
          Write-Host ([PRDPSingleDisplay]::MakePrimary($w,$h,$true))
          Start-Sleep -Seconds 3
          Show-Screens 'after detach'
          if((Test-Single) -and (Test-Probe)){
            Write-Host "PASS_SINGLE_DISPLAY ${w}x${h} is the only display"
          } else {
            Write-Host 'single-display mode not usable here - reverting to extended layout with the VDD as primary'
            $ok=$false
            for($i=1;$i -le 3 -and -not $ok;$i++){
              & "$env:SystemRoot\System32\DisplaySwitch.exe" /extend | Out-Null
              Start-Sleep -Seconds 3
              Write-Host ([PRDPSingleDisplay]::MakePrimary($w,$h,$false))
              Start-Sleep -Seconds 3
              Show-Screens "revert attempt $i"
              $ok=(Test-Probe)
            }
            Write-Host "REVERT capture probe ok=$ok"
          }
          try{
            Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue
            Start-Sleep -Milliseconds 600
            Start-Process explorer.exe
            Start-Sleep -Seconds 2
          }catch{ Write-Host "Explorer refresh non-fatal: $_" }
          }catch{ Write-Host "single-display step skipped (non-fatal): $_" }
          exit 0

      - name: Realtime tuning - animations, transparency, noisy services (non-fatal)
        if: ${{ inputs.ui_lite != '0' }}
        continue-on-error: true
        shell: pwsh
        run: |
