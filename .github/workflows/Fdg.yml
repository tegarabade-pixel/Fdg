          foreach($svc in 'wuauserv','UsoSvc','WSearch','SysMain','DiagTrack','DoSvc'){
            try{ Stop-Service -Name $svc -Force -ErrorAction Stop; Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue; Write-Host "service stopped: $svc" }catch{ Write-Host "service skip: $svc" }
          }
          foreach($svc in 'BITS','WerSvc','DPS','WdiServiceHost','WdiSystemHost','PcaSvc','edgeupdate','edgeupdatem','MapsBroker','RetailDemo'){
            try{ Stop-Service -Name $svc -Force -ErrorAction Stop; Set-Service -Name $svc -StartupType Disabled -ErrorAction SilentlyContinue; Write-Host "service stopped: $svc" }catch{ Write-Host "service skip: $svc" }
          }
          try{ Get-ScheduledTask -TaskPath '\Microsoft\Windows\UpdateOrchestrator\*','\Microsoft\Windows\WindowsUpdate\*','\Microsoft\Windows\Windows Defender\*','\Microsoft\Windows\Application Experience\*','\Microsoft\Windows\DiskDiagnostic\*' -ErrorAction SilentlyContinue | Disable-ScheduledTask -ErrorAction SilentlyContinue | Out-Null; Write-Host 'maintenance scheduled tasks: disabled' }catch{ Write-Host "scheduled task tweak skipped: $_" }
          try{
          Add-Type -Namespace PRDP -Name UiFx -MemberDefinition @'
          [DllImport("user32.dll", SetLastError=true)] public static extern bool SystemParametersInfo(uint a, uint b, IntPtr c, uint d);
          [DllImport("user32.dll", SetLastError=true, CharSet=CharSet.Unicode)] public static extern IntPtr SendMessageTimeout(IntPtr h, uint m, IntPtr w, string l, uint f, uint t, out IntPtr r);
          '@
          $z=[IntPtr]::Zero
          foreach($spi in 0x1043,0x1003,0x1005,0x1007,0x1015,0x1017){ [void][PRDP.UiFx]::SystemParametersInfo([uint32]$spi,0,$z,3) }
          $ai=[Runtime.InteropServices.Marshal]::AllocHGlobal(8)
          [Runtime.InteropServices.Marshal]::WriteInt32($ai,0,8)
          [Runtime.InteropServices.Marshal]::WriteInt32($ai,4,0)
          [void][PRDP.UiFx]::SystemParametersInfo(0x49,8,$ai,3)
          [Runtime.InteropServices.Marshal]::FreeHGlobal($ai)
          $p='HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          New-Item -Path $p -Force | Out-Null
          Set-ItemProperty -Path $p -Name EnableTransparency -Value 0 -Type DWord
          $p='HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
          New-Item -Path $p -Force | Out-Null
          foreach($n in 'TaskbarAnimations','ListviewAlphaSelect','ListviewShadow'){ Set-ItemProperty -Path $p -Name $n -Value 0 -Type DWord }
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name MenuShowDelay -Value '0'
          New-Item -Path 'HKCU:\Control Panel\Desktop\WindowMetrics' -Force | Out-Null
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop\WindowMetrics' -Name MinAnimate -Value '0'
          $r=[IntPtr]::Zero
          [void][PRDP.UiFx]::SendMessageTimeout([IntPtr]0xFFFF,0x001A,[IntPtr]::Zero,'ImmersiveColorSet',2,2000,[ref]$r)
          Write-Host 'UI effects: animations + transparency off'
          }catch{ Write-Host "UI tuning skipped (non-fatal): $_" }
          exit 0

      - name: Install fixed virtual audio endpoint - hard required
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          Write-Host '=== PrivateRDP v2.3.6 virtual audio bootstrap ==='
          $tmp=Join-Path $env:RUNNER_TEMP 'prdp-v236-vad'
          Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null

          function Invoke-WithRetry([scriptblock]$Action,[string]$What,[int]$Max=5){
            for($i=1;$i -le $Max;$i++){
              try{ return (& $Action) }
              catch{
                Write-Warning "$What attempt $i/$Max failed: $($_.Exception.Message)"
                if($i -ge $Max){ throw }
                Start-Sleep -Seconds ([int][Math]::Min(30,[Math]::Pow(2,$i)*2))
              }
            }
          }
          $repo='VirtualDrivers/Virtual-Audio-Driver'
          $tag='25.7.14'
          $ua='PrivateRDP-v2.4.29'
          $zipUrl=$null
          try{
            $hdr=@{ 'User-Agent'=$ua; 'Accept'='application/vnd.github+json' }
            if($env:GH_TOKEN){ $hdr['Authorization']='Bearer '+$env:GH_TOKEN }
            $rel=Invoke-WithRetry { Invoke-RestMethod -Headers $hdr -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" } 'GitHub API release lookup' 3
            $asset=$rel.assets | Where-Object { $_.name -match '\.zip$' } | Select-Object -First 1
            if($asset){ $zipUrl=$asset.browser_download_url; Write-Host "VAD asset via API: $($asset.name)" }
          }catch{ Write-Warning "GitHub API lookup failed, trying release HTML fallback: $($_.Exception.Message)" }
          if(-not $zipUrl){
            $html=Invoke-WithRetry { (Invoke-WebRequest -UseBasicParsing -Headers @{ 'User-Agent'=$ua } -Uri "https://github.com/$repo/releases/expanded_assets/$tag").Content } 'release HTML fallback' 4
            $hrefs=@([regex]::Matches($html,'href="(/[^"]+/releases/download/[^"]+\.zip)"') | ForEach-Object { $_.Groups[1].Value })
            Write-Host "VAD zip candidates (HTML): $($hrefs -join ', ')"
            $pick=$hrefs | Where-Object { $_ -match '(?i)sign' } | Select-Object -First 1
            if(-not $pick){ $pick=$hrefs | Select-Object -First 1 }
            if($pick){ $zipUrl='https://github.com'+$pick }
          }
          if(-not $zipUrl){ throw "Virtual Audio Driver $tag ZIP asset not found (API and HTML fallback both failed)" }
          Write-Host "VAD download: $zipUrl"
          $zip=Join-Path $tmp 'vad.zip'
          Invoke-WithRetry { Invoke-WebRequest $zipUrl -OutFile $zip -UseBasicParsing } 'VAD zip download' 4 | Out-Null
          $drv=Join-Path $tmp 'drv'
          Expand-Archive $zip $drv -Force
          $inf=Get-ChildItem $drv -Recurse -Filter VirtualAudioDriver.inf | Select-Object -First 1
          $cat=Get-ChildItem $drv -Recurse -Filter virtualaudiodriver.cat | Select-Object -First 1
          if(-not $inf){ throw 'VirtualAudioDriver.inf missing from signed release' }

          if($cat){
            try{
              $certs=New-Object Security.Cryptography.X509Certificates.X509Certificate2Collection
              $certs.Import([IO.File]::ReadAllBytes($cat.FullName))
              foreach($c in $certs){
                $cp=Join-Path $tmp ($c.Thumbprint+'.cer')
                [IO.File]::WriteAllBytes($cp,$c.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))
                Import-Certificate -FilePath $cp -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' | Out-Null
              }
            }catch{ Write-Warning "VAD catalog certificate import: $_" }
          }

          $nefZip=Join-Path $tmp 'nefcon.zip'
                    $preN=Join-Path $env:RUNNER_TEMP 'prdp-dl\nefcon.zip'
          if(Test-Path $preN){ Copy-Item $preN $nefZip -Force }
          else{ Invoke-WithRetry { Invoke-WebRequest 'https://github.com/nefarius/nefcon/releases/download/v1.14.0/nefcon_v1.14.0.zip' -OutFile $nefZip -UseBasicParsing } 'nefcon download' 4 | Out-Null }
          $nef=Join-Path $tmp 'nef'
          Expand-Archive $nefZip $nef -Force
          $nefexe=Get-ChildItem $nef -Recurse -Filter nefconw.exe | Where-Object FullName -Match '\\x64\\' | Select-Object -First 1
          if(-not $nefexe){ throw 'nefconw x64 missing' }
          & $nefexe.FullName install $inf.FullName 'ROOT\VirtualAudioDriver' 2>&1 | ForEach-Object { Write-Host $_ }
          pnputil /scan-devices 2>&1 | ForEach-Object { Write-Host $_ }
          Start-Sleep -Seconds 8
          try { Set-Service AudioEndpointBuilder -StartupType Automatic; Start-Service AudioEndpointBuilder } catch {}
          try { Set-Service Audiosrv -StartupType Automatic; Start-Service Audiosrv } catch {}
          Start-Sleep -Seconds 4

          $nodes=Get-PnpDevice -ErrorAction SilentlyContinue | Where-Object { $_.InstanceId -match 'VirtualAudioDriver' -or $_.FriendlyName -match 'Virtual Audio' }
          if(-not $nodes){ throw 'Virtual Audio Driver PnP node not found' }
          $healthy=$false
          foreach($d in $nodes){
            $pc=999
            try{$pc=[int](Get-PnpDeviceProperty -InstanceId $d.InstanceId -KeyName 'DEVPKEY_Device_ProblemCode' -ErrorAction Stop).Data}catch{}
            Write-Host "VAD PnP: status=$($d.Status) name=$($d.FriendlyName) id=$($d.InstanceId) problem=$pc"
            if($pc -eq 0){$healthy=$true}
          }
          if(-not $healthy){throw 'Virtual Audio Driver did not reach ProblemCode 0'}

          python -c "import soundcard as sc; print('speakers=', [x.name for x in sc.all_speakers()]); s=sc.default_speaker(); print('default=', None if s is None else s.name); assert s is not None, 'no default render endpoint'"

      - name: Materialize v2.4.32 recovery control host
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $b64=''
          $path=Join-Path $env:RUNNER_TEMP 'prdp_v2424_host.py'
          [IO.File]::WriteAllBytes($path,[Convert]::FromBase64String($b64))
          python -m py_compile $path
          "RDP_HOST_SCRIPT=$path" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          Write-Host "Host control/signaling script ready: $path (Python never touches video pixels)"

      - name: Scheduler and Tailscale realtime priority (non-fatal)
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $ProgressPreference='SilentlyContinue'
          Write-Host "Runner logical CPUs: $env:NUMBER_OF_PROCESSORS"
          try{ Get-CimInstance Win32_Processor | ForEach-Object { Write-Host "CPU: $($_.Name) cores=$($_.NumberOfCores) logical=$($_.NumberOfLogicalProcessors)" } }catch{ Write-Host "cpu info skipped: $_" }
          try{
            $k='HKLM:\SYSTEM\CurrentControlSet\Control\PriorityControl'
            $old=(Get-ItemProperty -Path $k -Name Win32PrioritySeparation -ErrorAction Stop).Win32PrioritySeparation
            Set-ItemProperty -Path $k -Name Win32PrioritySeparation -Value 38 -Type DWord -ErrorAction Stop
            Write-Host "Win32PrioritySeparation: $old -> 38 (0x26: short quantum + foreground boost)"
          }catch{ Write-Host "PrioritySeparation skipped: $_" }
          try{
            $n=0
            foreach($name in 'tailscaled','tailscale-ipn'){
              Get-Process -Name $name -ErrorAction SilentlyContinue | ForEach-Object {
                try{ $_.PriorityClass='High'; $n++; Write-Host "priority High: $($_.ProcessName) pid=$($_.Id)" }catch{ Write-Host "priority skip $($_.ProcessName): $_" }
              }
            }
            if($n -eq 0){ Write-Host 'tailscaled process not found (non-fatal)' }
          }catch{ Write-Host "tailscale priority skipped: $_" }
          try{
            $lowered=0
            foreach($pn in 'TiWorker','TrustedInstaller','MoUsoCoreWorker','UsoClient','wuauclt','SearchIndexer','SearchProtocolHost','SearchFilterHost','CompatTelRunner','DismHost','OneDrive','MicrosoftEdgeUpdate','msedge','WerFault'){
              Get-Process -Name $pn -ErrorAction SilentlyContinue | ForEach-Object {
                try{ $_.PriorityClass='Idle'; $lowered++; Write-Host "priority Idle: $($_.ProcessName) pid=$($_.Id)" }catch{ }
              }
            }
            Write-Host "background processes lowered to Idle: $lowered"
          }catch{ Write-Host "background priority skipped: $_" }
          try{
            powercfg /setactive SCHEME_MIN 2>&1 | Out-Null
            Write-Host 'power plan: High performance (best effort)'
          }catch{ Write-Host "power plan skipped: $_" }
          exit 0

      - name: Run PrivateRDP v2.4.32 recovery pipeline
        shell: pwsh
        env:
          RDP_ROOM: ${{ inputs.room_code }}
          RDP_WIDTH: ${{ inputs.width }}
          RDP_HEIGHT: ${{ inputs.height }}
          RDP_FPS: ${{ inputs.fps }}
          RDP_BITRATE_MBPS: ${{ inputs.bitrate_mbps }}
          RDP_WIRE_PACE_MBPS: ${{ inputs.wire_pace_mbps }}
          RDP_KEY_PACE_MBPS: ${{ inputs.key_pace_mbps }}
          RDP_CRF: ${{ inputs.crf }}
          RDP_VBV_MS: ${{ inputs.vbv_ms }}
          RDP_IDR_SEC: ${{ inputs.idr_sec }}
          RDP_IDR_MIN_GAP_MS: ${{ inputs.idr_min_gap_ms }}
          RDP_IDLE_REPEAT: ${{ inputs.idle_60 }}
          RDP_X264_THREADS: ${{ inputs.x264_threads }}
          RDP_X264_QUALITY: ${{ inputs.x264_quality }}
          RDP_RELAY_PACE_MBPS: ${{ inputs.relay_pace_mbps }}
          RDP_RESUME_IDR: ${{ inputs.resume_idr }}
          RDP_LIVENESS_SEC: ${{ inputs.liveness_sec }}
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $room=($env:RDP_ROOM -replace '[^A-Za-z0-9]','').ToUpperInvariant()
          if($room.Length -lt 12){throw 'room_code must contain at least 12 alphanumeric characters'}
          $bytes=New-Object byte[] 24
          [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $token=([Convert]::ToHexString($bytes)).ToLowerInvariant()
          $generation="${{ github.run_id }}-${{ github.run_attempt }}"
          $started=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $env:RDP_ROOM=$room
          $env:RDP_SESSION_TOKEN=$token
          $env:RDP_GENERATION=$generation
          $env:RDP_STARTED_AT_MS=$started.ToString()
          $env:RDP_UDP_PORT='49100'
          $env:RDP_TCP_PORT='49101'
          $env:RDP_VIDEO_PORT='0'
          $env:RDP_AUDIO_PORT='49103'
          $env:RDP_AUDIO_RATE='48000'
          $env:RDP_NATIVE_VIDEO_CTL_PORT='49210'
          Write-Host '=== PrivateRDP v2.4.32 RECOVERY SMOOTH-60 FEC4+2 ==='
          Write-Host "Room       : $room"
          Write-Host "Generation : $generation"
          Write-Host "Tailnet IP : $env:RDP_TAILSCALE_IP"
          Write-Host "Stream     : $env:RDP_WIDTH x $env:RDP_HEIGHT @ $env:RDP_FPS fps"
          Write-Host "Bitrate    : $env:RDP_BITRATE_MBPS Mbps (hard cap 10 Mbps)"
          Write-Host "Wire pace  : $env:RDP_WIRE_PACE_MBPS Mbps ceiling (schedule-anchored pacer, 2 ms bounded catch-up, 0.5 ms timer)"
          Write-Host "Rate ctrl  : CRF $env:RDP_CRF (0=ABR), VBV $env:RDP_VBV_MS ms, backup IDR every $env:RDP_IDR_SEC s"
          Write-Host "IDR gap    : $env:RDP_IDR_MIN_GAP_MS ms min between client-requested IDRs (0 = off); IDR paced at key_pace=$env:RDP_KEY_PACE_MBPS Mbps (0 = wire_pace); FEC interleave 16 groups"
          Write-Host 'Display    : HARD exact VDD + native DXGI Desktop Duplication; no MSS/DXCAM/WGC fallback'
          Write-Host 'Mouse      : Runner-owned pointer composited into video + SendInput ABSOLUTE|VIRTUALDESK; latest-only CONTROL-TCP MOVE; pointer-only DXGI wake-ups skipped; cursor re-encodes on fps grid'
          Write-Host 'Video core : C++ DXGI/FFmpeg/libx264 + overlapped encode/send + fixed nonblocking UDP pacer; Python control uses reliable loopback TCP ACKs'
          Write-Host 'Transport  : PRV4 v5 epoch + fixed FEC4+2 + PVH4 heartbeat; use Android v2.4.22 MAX-LOW-LATENCY'
          Write-Host "Idle 60fps : $env:RDP_IDLE_REPEAT (1 = repeat frames keep the stream at target fps while static)"
          Write-Host "Recovery   : UDP connreset immune, relay pace $env:RDP_RELAY_PACE_MBPS Mbps until DIRECT, resume IDR $env:RDP_RESUME_IDR"
          Write-Host "Roaming    : liveness $env:RDP_LIVENESS_SEC s, x264 threads $env:RDP_X264_THREADS, TCP keepalive+NODELAY, fast tailscale path re-probe on HELLO resume, PLI retry after 300 ms"
          python -u $env:RDP_HOST_SCRIPT
